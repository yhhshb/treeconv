name: Release

# Push a tag like v0.1.0 (matching core.__version__) to build every platform and
# create a draft GitHub release with the packages attached. Run it manually from the
# Actions tab to get the packages as workflow artifacts without making a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-22.04 }      # oldest glibc = widest compatibility
          - { name: linux-arm64, os: ubuntu-22.04-arm }
          - { name: windows-x64, os: windows-2022 }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x64,   os: macos-15-intel }
    env:
      # Optional macOS signing + notarization: add these repository secrets to enable it.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}            # base64 of the .p12
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}        # "Developer ID Application: …"
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check that the tag matches core.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="v$(python -c 'import core; print(core.__version__)')"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match core.__version__ ($v)"; exit 1
          fi

      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements.txt

      - name: Install ffmpeg (Linux, for the smoke test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Inno Setup and ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup ffmpeg -y --no-progress

      - name: Build
        run: python packaging/build.py build

      - name: Sign the app (macOS, optional)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" build.keychain
          codesign --force --deep --timestamp --options runtime \
            --entitlements packaging/macos/entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" dist/treeconv.app
          codesign --verify --deep --strict dist/treeconv.app

      - name: Package
        run: python packaging/build.py package

      - name: Notarize the disk image (macOS, optional)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          dmg=$(ls dist/release/*.dmg)
          codesign --timestamp --sign "$MACOS_SIGN_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"

      - name: Smoke test
        run: python packaging/build.py smoke

      - uses: actions/upload-artifact@v6
        with:
          name: treeconv-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "treeconv ${GITHUB_REF_NAME#v}" \
            --draft --generate-notes
