name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.13"]
        include:
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest,   python: "3.13" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Byte-compile
        run: python -m compileall -q core.py treeconv.py gui.py packaging/build.py
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Smoke test (command-line mode from source)
        run: python packaging/build.py smoke --source
